[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlmm"
description = "ML/MM toolkit"
readme = "README.md"
authors = [{name = "Takuto Ohmura"}]
license = {file = "LICENSE"}
dynamic = ["version"]
requires-python = ">=3.11"
# Pinned to the env this fork runs in, mlmm_v1. Its ML side is the relax
# project's fine-tuning env (fairchem 2.22.1.dev19 at facebookresearch@a1605489f,
# torch 2.13.0), because only that fairchem loads the checkpoints fine-tuning
# writes; the older t-0hmura/fairchem of the legacy env cannot. Its MM and
# optimiser side keeps the versions of the legacy env. The relax project keeps
# the full list, including everything these pull in:
# https://github.com/Sergi-Ortiz/relax/tree/main/finetuning/mlmm_env
dependencies = [
    "fairchem-core @ git+https://github.com/facebookresearch/fairchem.git@a1605489fc8ffe875108721b2c25d08b70375f5b#subdirectory=packages/fairchem-core",
    "pysisyphus @ git+https://github.com/t-0hmura/pysisyphus_for_mlmm.git@4c2373e232e5d54846de2d7c93cab9c4f882f29c",
    "torch==2.13.0",
    "numpy==2.4.6",
    "ase==3.29.0",
    "openmm==8.3.1",
    "openmm-cuda-12==8.3.1; sys_platform == 'linux'",  # OpenMM's CUDA platform; no macOS build
    "parmed==4.3.1",
    "rdkit==2025.9.6",
    "biopython==1.86",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
    "plotly==6.6.0",
    "kaleido==1.2.0",
]

[project.optional-dependencies]
# Only backend: aimnet2 imports aimnet, and it needs numba-cuda (no macOS build).
aimnet2 = [
    "aimnet @ git+https://github.com/t-0hmura/aimnetcentral.git@983bc1b91d042af3886e5d770c3c9575e3e3369c",
]
# The tests in tests/.
test = [
    "pytest==9.1.1",
]

[project.scripts]
mlmm = "mlmm.mlmm_pysis:run_pysis"
def_ml_region = "mlmm.def_ml_region:def_ml_region"
add_elem_info = "mlmm.utils:add_elem_info_console"
get_freeze_indices = "mlmm.utils:get_freeze_indices_console"
xyz_geom2pdb = "mlmm.utils:xyz_geom2pdb_console"
ts_search = "mlmm.partial_hessian_dimer_cli:main"
bond_scan = "mlmm.cartesian_bond_scan_cli:main"
energy_summary = "mlmm.energy_summary:main"
trj2fig = "mlmm.trj2fig:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mlmm*"]

[tool.setuptools]
package-data = { "mlmm" = ["py.typed"] }

[tool.setuptools.dynamic]
version = {attr = "mlmm.__version__"}
